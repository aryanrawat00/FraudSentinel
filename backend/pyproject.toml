[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudsentinel-backend"
version = "0.1.0"
description = "FraudSentinel API and synthetic development foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "SQLAlchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["../tests/unit", "../tests/integration", "../tests/security"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]
